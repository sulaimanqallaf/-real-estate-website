# AI Quant Research Bot configuration.
# Non-secret settings only. Telegram token/chat id live in .env (see .env.example).

tickers:
  - SPY
  - QQQ
  - VOO
  - VGT
  - SMH
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - META
  - TSLA
  - GOOGL
  - AMZN
  - GLD
  - USO

benchmark_ticker: SPY          # used for "return vs SPY" relative strength
secondary_benchmark: QQQ        # only used for backtest comparison

# Used only to pick a "Best sector/ETF" line for the report - not a strategy input.
etf_tickers: [SPY, QQQ, VOO, VGT, SMH, GLD, USO]
equity_tickers: [AAPL, MSFT, NVDA, AMD, META, TSLA, GOOGL, AMZN]

# Sector/group mapping used by the Portfolio Risk Engine for concentration checks.
# A ticker missing from this map is treated as its own single-ticker "sector" (its
# symbol), so concentration math never crashes on an unmapped ticker - it just
# can't be concentrated with anything else by sector.
sector_map:
  SPY: broad_market
  VOO: broad_market
  QQQ: growth_index
  VGT: technology
  SMH: semiconductors
  AAPL: technology
  MSFT: technology
  NVDA: semiconductors
  AMD: semiconductors
  META: communication_services
  GOOGL: communication_services
  AMZN: consumer_discretionary
  TSLA: consumer_discretionary
  GLD: gold
  USO: energy

# Which strategies apply to which tickers. Every ticker in `tickers:` above is
# assigned to at least one strategy, so every ticker can generate a trade candidate:
#   SPY, QQQ                                        -> mean reversion + trend following
#   VOO, VGT, SMH                                     -> trend following + momentum breakout
#   AAPL, MSFT, NVDA, AMD, META, TSLA, GOOGL, AMZN      -> momentum breakout + trend following
#   GLD, USO                                             -> trend following only
# A ticker not listed under a given strategy simply never triggers THAT strategy's
# candidate - it still gets scored on the universal indicator criteria and still
# gets an options-skew classification regardless.
strategy_universe:
  mean_reversion: [SPY, QQQ]
  momentum_breakout: [VOO, VGT, SMH, AAPL, MSFT, NVDA, AMD, META, TSLA, GOOGL, AMZN]
  trend_following: [SPY, QQQ, VOO, VGT, SMH, AAPL, MSFT, NVDA, AMD, META, TSLA, GOOGL, AMZN, GLD, USO]

data:
  history_period: "2y"      # yfinance period for daily download (need 200D MA + 1y backtest)
  interval: "1d"             # Version 1 daily bars for indicators/strategies/backtest.
  # yfinance intraday (15m) history is capped at ~60 days by Yahoo itself, which is too
  # short for a 200D-MA-gated strategy or a 1-year backtest. Version 1 therefore runs
  # mean reversion on daily bars; set to "15m" only if you accept that limitation and
  # wire a shorter lookback for that one strategy yourself.
  mean_reversion_interval: "1d"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  reports_dir: "data/reports"
  journal_dir: "data/journal"

indicators:
  sma_windows: [20, 50, 200]
  ema_windows: [50, 200]
  rsi_period: 14
  atr_period: 14
  bollinger_window: 20
  bollinger_std_multiplier: 2.0
  momentum_days: [20, 60]
  one_month_trading_days: 21
  relative_volume_window: 20
  volatility_window: 20

strategies:
  mean_reversion:
    # SAFE mode (default, always used for Top Candidates / the trade journal).
    ma_window: 20
    std_dev_threshold: 1.5      # price must be below MA by > 1.5 std devs
    require_trend_intact: true   # "trend not broken" == price still above SMA200
    atr_stop_multiplier: 1.0      # tighter stop for a reversion trade

    # AGGRESSIVE mode: a second, riskier dip-buy lens on the SAME tickers (SPY/QQQ),
    # requiring a deeper washout and NOT requiring price to be above SMA200. Always
    # computed and shown in the "High Risk Dip Watchlist" report section regardless
    # of `enabled` below - the flag only controls whether it may ever become a Top
    # Candidate or reach the trade journal. Leave `enabled: false` unless you have
    # explicitly decided you want aggressive dip-buys to be tradeable.
    aggressive_mode:
      enabled: false               # master switch - see README "High Risk Dip Watchlist"
      std_dev_threshold: 2.0        # deeper washout required than Safe mode
      require_trend_intact: false    # the whole point of aggressive mode: no SMA200 gate
      atr_stop_multiplier: 1.75        # wider stop - catching a falling knife is riskier

  momentum_breakout:
    breakout_window: 20            # 20-day high breakout
    volume_multiplier: 1.5          # volume must exceed 1.5x its 20D average
    atr_stop_multiplier: 2.0
    reward_risk_multiple: 2.0        # target = entry + reward_risk_multiple * risk

  trend_following:
    atr_stop_multiplier: 2.5
    reward_risk_multiple: 2.0

  skew:
    otm_pct: 0.10                 # how far out-of-the-money to sample calls/puts (10%)
    target_expiration_min_days: 20
    target_expiration_max_days: 45
    one_month_return_days: 21      # matches indicators.one_month_trading_days
    skew_threshold: 0.02            # |skew| must exceed this to call it "bid", else Neutral
    favorable_skew_labels: ["Contrarian Bid", "Chase"]  # "calls bid" scenarios -> scoring bonus

scoring:
  points:
    above_sma_200: 15
    above_sma_50: 10
    momentum_20d_positive: 10
    momentum_60d_positive: 10
    rsi_in_healthy_range: 10
    volume_above_avg: 10
    trend_following_positive: 10
    momentum_breakout_active: 10
    favorable_options_skew: 10
    risk_reward_above_threshold: 5
  rsi_healthy_min: 45
  rsi_healthy_max: 68
  labels:
    strong_candidate_min: 80
    watchlist_min: 65
    weak_watchlist_min: 50
    # below weak_watchlist_min => Avoid

risk:
  account_equity: 10000            # edit to your real account size; not a secret, just a default
  risk_pct_per_trade: 0.75          # spend between 0.5 and 1.0 (%) of equity risk per trade
  min_risk_reward_ratio: 1.5
  max_rsi_for_trade: 75
  require_above_sma_200: true
  reject_if_downside_exceeds_upside: true
  allow_margin: false               # Version 1 hard constraint, not user-editable in practice
  allow_options_trading: false        # Version 1 hard constraint
  allow_shorting: false                # Version 1 hard constraint

backtest:
  lookback_period: "1y"
  initial_capital: 10000
  max_holding_days: 30
  risk_pct_per_trade: 0.75
  benchmarks: [SPY, QQQ]

telegram:
  enabled: true
  max_message_chars: 3500
  top_candidates_limit: 8

# Telegram approval flow for PAPER TRADES ONLY - never a real order, never IBKR.
# main.py sends one extra message per Top Candidate with Approve/Reject/Watch Only
# buttons; a separate, continuously-running process (`python -m
# src.approval_listener` - see README) processes the button presses whenever they
# happen and appends approvals to data/journal/paper_trades.csv. High Risk Dip
# Watchlist entries never get buttons - informational only, always.
paper_trading:
  enabled: true                                # master switch for the whole approval flow AND lifecycle tracking
  paper_trades_file: "paper_trades.csv"           # written under data.journal_dir
  pending_approvals_file: "pending_approvals.json"  # written under data.journal_dir
  update_offset_file: "telegram_update_offset.txt"    # approval_listener's persisted getUpdates offset
  pending_expiry_hours: 72                              # a button tapped after this long is refused
  poll_interval_seconds: 3                                # approval_listener's idle sleep between polls
  poll_timeout_seconds: 30                                 # Telegram long-poll timeout per getUpdates call
  max_holding_days: 20                                      # OPEN paper trade force-exits at close after this many days

# Portfolio Risk Engine - sits AFTER individual risk approval and market-regime
# admission, BEFORE a candidate becomes a Top Candidate. Derives portfolio state
# purely from OPEN rows in paper_trades.csv (closed trades never count toward
# exposure). Can only keep an individually-approved position size the same,
# reduce it, or reject it outright - it can never increase what risk_manager.py
# already sized. See src/portfolio_risk.py and README "Portfolio Risk Engine".
portfolio_risk:
  enabled: true
  max_open_positions: 6
  max_total_open_risk_pct: 0.03      # sum of (entry-stop)*shares across OPEN trades, as a fraction of account_equity - risk-to-stop, NOT notional exposure
  max_single_position_pct: 0.20       # one position's notional value (entry*shares), as a fraction of account_equity
  max_sector_exposure_pct: 0.35        # one sector_map group's total notional value, as a fraction of account_equity
  max_correlated_positions: 2           # existing OPEN positions highly correlated with a candidate before it's reduced/rejected
  correlation_lookback_days: 60
  correlation_min_periods: 30             # minimum overlapping daily-return observations required to trust a correlation figure at all
  high_correlation_threshold: 0.80
  # Explicit, correlation-independent overlap groups - flagged even when historical
  # correlation can't be computed (e.g. a recent IPO). Keep this simple/hand-maintained.
  overlap_groups:
    broad_market_etfs: [SPY, VOO]
    growth_tech_etfs: [QQQ, VGT]
    semiconductor_cluster: [SMH, NVDA, AMD]
  # Applied, in order, whenever a resize step (risk budget / single-position cap /
  # sector cap / correlation cap) still leaves a position technically nonzero but
  # too small to be worth taking.
  min_viable_shares: 1

# Market Regime Engine - simple, explainable SPY/QQQ-based rules, no ML. Runs
# BEFORE the Portfolio Risk Engine: it can shrink a candidate's size and/or block
# a strategy outright for the current regime; portfolio risk then works from
# whatever size survives that. See src/market_regime.py and README "Market Regime
# Engine". Every multiplier here can only reduce a position, never increase it.
market_regime:
  enabled: true
  high_volatility_pct_threshold: 2.5    # daily_volatility_pct (rolling 20D std of daily returns, already computed) above this on SPY or QQQ = "elevated"
  drawdown_lookback_days: 60
  risk_off_drawdown_pct_threshold: 10.0   # SPY trailing drawdown over drawdown_lookback_days beyond this contributes to RISK_OFF

  # Regime-wide position-size multiplier, applied to every candidate regardless
  # of strategy. Composes with each strategy's own status multiplier below
  # (regime-wide first, then status-specific) - see README for the full order.
  position_multipliers:
    BULL_TREND: 1.00
    BULL_VOLATILE: 0.75
    SIDEWAYS: 0.75
    BEAR_TREND: 0.50
    HIGH_VOLATILITY: 0.50
    RISK_OFF: 0.25

  # Per-regime, per-strategy admission status: preferred | allowed | reduced |
  # restricted | blocked. "preferred"/"allowed" behave identically today (both
  # admit at the regime-wide multiplier with no extra cut) - "preferred" exists
  # purely as a documentation/labeling distinction on top of "allowed", per the
  # spec's own wording, not a behavioral one.
  strategy_preferences:
    BULL_TREND:
      trend_following: preferred
      momentum_breakout: preferred
      mean_reversion_safe: allowed
      mean_reversion_aggressive: reduced
    BULL_VOLATILE:
      trend_following: allowed
      momentum_breakout: reduced
      mean_reversion_safe: allowed
      mean_reversion_aggressive: reduced
    SIDEWAYS:
      trend_following: reduced
      momentum_breakout: reduced
      mean_reversion_safe: preferred
      mean_reversion_aggressive: reduced
    BEAR_TREND:
      trend_following: restricted        # spec's "heavily restricted" - simplified to the same "restricted" status as the others below, per the spec's own "simplify overlapping classifications" allowance
      momentum_breakout: restricted
      mean_reversion_safe: restricted
      mean_reversion_aggressive: blocked    # exception: becomes "restricted" instead of a hard block if aggressive_mode.enabled is true - see market_regime.evaluate_regime_admission
    HIGH_VOLATILITY:
      trend_following: restricted
      momentum_breakout: restricted
      mean_reversion_safe: restricted
      mean_reversion_aggressive: blocked
    RISK_OFF:
      trend_following: restricted
      momentum_breakout: restricted
      mean_reversion_safe: restricted
      mean_reversion_aggressive: blocked

  # Extra size cut applied on top of the regime-wide multiplier above, by status.
  # "blocked" is a hard reject, never a multiplier - it has no entry here.
  status_size_multipliers:
    preferred: 1.00
    allowed: 1.00
    reduced: 0.75
    restricted: 0.50

  # Optional stricter score bar layered ON TOP of the existing Avoid-label gate -
  # never looser, never a replacement for it. A regime with no entry here uses
  # only the existing label gate. Also doubles as the "exceptional conditions"
  # bar for the BEAR_TREND Aggressive Mean Reversion exception above.
  score_thresholds:
    BEAR_TREND: 85
    HIGH_VOLATILITY: 75
    RISK_OFF: 80

# Big Money Data Engine (Phase 5) - institutional/insider/macro/options-flow
# CONTEXT, never a trade gate. See src/big_money.py and README "Big Money
# Data Engine". `use_for_ranking: false` (default) means this is purely
# reporting/context: it's computed and shown, but never changes which
# candidates clear risk/regime/portfolio/aggressive-mode gates. Even with
# `use_for_ranking: true`, big_money.py's own contract forbids promoting an
# Avoid-labeled candidate or touching best_risk_result/regime_evaluation/
# portfolio_evaluation - see apply_big_money_ranking_filter()'s docstring.
big_money:
  enabled: true
  use_for_ranking: false
  ranking_caution_threshold: -0.30   # composite score at/below this adds a cautionary note when use_for_ranking is true

# Smart Money Concepts structural price features (Fair Value Gaps, swing
# highs/lows, order blocks, BOS/CHoCH, liquidity sweeps) - see
# src/smc_features.py. Every feature carries an explicit `available_at`
# separate from the bar it structurally belongs to, so nothing here can leak
# future candles into an earlier point-in-time row - see README "Causal SMC
# feature handling".
smc:
  enabled: true
  swing_left_bars: 2
  swing_right_bars: 2                     # a swing isn't "available" until this many bars AFTER it exist
  order_block_lookahead_bars: 3            # confirming-move window after a candidate order-block candle
  order_block_impulse_threshold_pct: 1.5

# External data providers backing the Big Money layer - see src/data_providers/.
# Each is independently optional; a disabled/unconfigured provider returns a
# clean "Data Unavailable" result (never a crash, never a fabricated value).
providers:
  sec:
    enabled: true            # gated further at runtime on the SEC_IDENTITY env var (see .env.example)
  fred:
    enabled: true            # gated further at runtime on the FRED_API_KEY env var (see .env.example)
  options_flow:
    enabled: false           # no paid vendor wired up yet - always resolves to the mock/no-data provider

# Point-in-time ML dataset builder output (src/dataset_builder.py) - Parquet
# files, never used to train a model in this phase. See README "ML dataset
# design".
dataset:
  output_dir: "data/processed/ml"
  min_history_bars: 200

# Quant / ML Intelligence layer (Phase 6) - see src/ml/, src/quant_agent.py,
# and README "Quant / ML Intelligence Layer". Advisory/stricter-only: it
# CANNOT override the individual risk manager, market regime filter,
# portfolio risk manager, or aggressive-mode gate; it cannot promote an
# Avoid candidate; it cannot increase a position's size. `use_for_filtering`
# defaults to false - ML is report/ranking context only until explicitly
# turned on, and even then it can only ADD a stricter rejection on top of an
# already-otherwise-eligible candidate, never remove one.
ml:
  enabled: true
  use_for_filtering: false
  minimum_confidence_for_filtering: HIGH   # ML must be at least this confident (in a NEGATIVE signal) before use_for_filtering can block anything
  primary_horizon: 10                       # which forward_Nd_return horizon the daily report's ML section uses (5, 10, or 20)
  registry_dir: "data/models"                # trained model artifacts + metadata (see src/ml/model_registry.py) - never written to by src.main, only read
  classification_thresholds:                  # forward return a horizon must exceed to count as "success" for the classification target
    "5d": 0.01
    "10d": 0.015
    "20d": 0.02

# Structural price features (Fair Value Gaps, swing highs/lows, order
# blocks, BOS/CHoCH, liquidity sweeps) already configured under `smc:`
# above (Phase 5) are reused as-is here - see src/ml/features.py's
# FEATURE_WHITELIST, which is dataset_builder.FEATURE_COLUMNS verbatim.

# Quant Agent (src/quant_agent.py) - combines rule score, regime fit, Big
# Money context, ML prediction, and strategy performance memory into one
# reporting QuantAssessment per ticker. Never a gate by itself; see
# quant_agent.py's module docstring.
quant_agent:
  eligible_score_threshold: 0   # a QuantAssessment's own quant_score at/above this (for an otherwise-eligible candidate) is labeled ELIGIBLE rather than WEAK - purely a reporting label, changes nothing about approval

logging:
  level: "INFO"
  log_dir: "data/reports"
